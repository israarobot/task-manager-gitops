apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: backend-api
        image: israa23/task-manager-backend:1dd47bf
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: supabase-secrets
